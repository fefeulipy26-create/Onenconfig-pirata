                  cfg.get("modulos", "zoom", true).set(zoom);
                  cfg.get("fpsboost", "aplicarAoIniciar", false).set(fpsBoostOnStart);
                  cfg.get("fpsboost", "distanciaDeRenderizacao", 6).set(renderDistance);
                  cfg.get("animacoes", "semAnimacaoTrocarItem", false).set(noReequip);
                  cfg.get("animacoes", "andarDeCostasModerno", false).set(modernBackwalk);
                  cfg.get("animacoes", "velocidadeSwing", 100).set(swingSpeed);
                  cfg.get("animacoes", "itemPersonalizado", false).set(itemCustom);
                  cfg.get("animacoes", "itemX", 0).set(itemX);
                  cfg.get("animacoes", "itemY", 0).set(itemY);
                  cfg.get("animacoes", "itemZ", 0).set(itemZ);
                  cfg.get("animacoes", "itemRotX", 0).set(itemRotX);
                  cfg.get("animacoes", "itemRotY", 0).set(itemRotY);
                  cfg.get("animacoes", "itemRotZ", 0).set(itemRotZ);
                  cfg.get("animacoes", "itemTamanho", 100).set(itemScale);
                  for (String[] m : EXTRA_MODS) {
                      if (m[0].startsWith("#")) continue;
                      cfg.get("extras", m[0], false).set(flag(m[0]));
                  }
                  cfg.get("extras", "nivelZoom", 4).set(zoomLevel);
                  cfg.get("extras", "hudX", 0).set(hudX);
                  cfg.get("extras", "hudY", 0).set(hudY);
                  cfg.get("extras", "particulasPorHit", 1).set(partCount);
                  cfg.get("extras", "tamanhoHud", 100).set(hudScale);
                  cfg.get("extras", "corHud", 0).set(hudColor);
                  cfg.get("extras", "miraEstilo", 0).set(crossStyle);
                  cfg.get("extras", "miraCor", 2).set(crossColor);
                  cfg.get("extras", "miraTamanho", 5).set(crossSize);
                  cfg.get("extras", "contornoCor", 3).set(outlineColor);
                  cfg.get("extras", "horaFixa", 0).set(fixedTime);
                  cfg.save();
              }
          }
          LEGITEOF
          cat > proj/src/main/java/com/legitclient/FpsBoost.java <<'LEGITEOF'
          package com.legitclient;

          import net.minecraft.client.Minecraft;
          import net.minecraft.client.settings.GameSettings;
          import org.lwjgl.opengl.Display;

          /** Só mexe nas opções de vídeo do próprio jogo (nada de hack). */
          public class FpsBoost {
              public static void apply() {
                  Minecraft mc = Minecraft.getMinecraft();
                  GameSettings gs = mc.gameSettings;
                  if (gs == null) return;

                  gs.fancyGraphics = false;
                  gs.clouds = 0;
                  gs.particleSetting = 1;
                  gs.ambientOcclusion = 0;
                  gs.entityShadows = false;
                  gs.useVbo = true;
                  gs.enableVsync = false;
                  gs.limitFramerate = 260;
                  gs.renderDistanceChunks = Math.min(gs.renderDistanceChunks, ModConfig.renderDistance);
                  try {
                      Display.setVSyncEnabled(false);
                  } catch (Throwable ignored) {
                  }
                  gs.saveOptions();
                  if (mc.renderGlobal != null && mc.theWorld != null) {
                      mc.renderGlobal.loadRenderers();
                  }
              }
          }
          LEGITEOF
          cat > proj/src/main/java/com/legitclient/Animations.java <<'LEGITEOF'
          package com.legitclient;

          import net.minecraft.client.Minecraft;
          import net.minecraft.client.entity.EntityPlayerSP;
          import net.minecraft.client.renderer.ItemRenderer;
          import net.minecraft.client.renderer.block.model.ItemTransformVec3f;
          import net.minecraft.entity.player.EntityPlayer;
          import net.minecraft.client.resources.model.IBakedModel;
          import net.minecraft.item.ItemStack;
          import net.minecraftforge.client.event.RenderHandEvent;
          import net.minecraftforge.fml.common.eventhandler.SubscribeEvent;
          import net.minecraftforge.fml.common.gameevent.TickEvent;
          import net.minecraftforge.fml.relauncher.ReflectionHelper;

          import java.lang.reflect.Field;
          import java.util.IdentityHashMap;
          import java.util.Map;

          /**
           * Animações estilo OverflowAnimations, só com eventos do Forge (sem Mixin, sem OneConfig),
           * pra funcionar no Pojav. Tudo é visual do lado do cliente.
           */
          public class Animations {
              private final Minecraft mc = Minecraft.getMinecraft();

              private final Map<ItemTransformVec3f, float[]> base = new IdentityHashMap<ItemTransformVec3f, float[]>();
              private boolean dirty;

              private boolean reflectReady, reflectFailed;
              private Field fEquipped, fPrev, fItem, fSlot;

              private float swingAcc;

              private void initReflection() {
                  if (reflectReady) return;
                  reflectReady = true;
                  try {
                      fEquipped = ReflectionHelper.findField(ItemRenderer.class, "equippedProgress", "field_78454_c");
                      fPrev = ReflectionHelper.findField(ItemRenderer.class, "prevEquippedProgress", "field_78451_d");
                      fItem = ReflectionHelper.findField(ItemRenderer.class, "itemToRender", "field_78453_b");
                      fSlot = ReflectionHelper.findField(ItemRenderer.class, "equippedItemSlot", "field_78450_g");
                  } catch (Throwable t) {
                      reflectFailed = true;
                  }
              }

              @SubscribeEvent
              public void onTick(TickEvent.ClientTickEvent e) {
                  if (e.phase != TickEvent.Phase.END) return;
                  EntityPlayerSP p = mc.thePlayer;
                  if (p == null) return;

                  // Andar de costas moderno: o corpo não vira de lado ao andar pra trás
                  if (ModConfig.modernBackwalk && mc.theWorld != null) {
                      for (Object o : mc.theWorld.playerEntities) {
                          EntityPlayer pl = (EntityPlayer) o;
                          if (pl.isRiding() || pl.isPlayerSleeping()) continue;
                          double dx = pl.posX - pl.prevPosX;
                          double dz = pl.posZ - pl.prevPosZ;
                          if (dx * dx + dz * dz < 0.0025) continue;
                          float look = pl == p ? pl.rotationYaw : pl.rotationYawHead;
                          double r = Math.toRadians(look);
                          double fwd = -Math.sin(r) * dx + Math.cos(r) * dz;
                          if (fwd < -0.02) {
                              pl.renderYawOffset = look;
                          }
                      }
                  }

                  // Velocidade do swing (só visual)
                  if (ModConfig.swingSpeed != 100 && p.isSwingInProgress) {
                      swingAcc += ModConfig.swingSpeed / 100f - 1f;
                      if (swingAcc >= 1f) {
                          p.swingProgressInt++;
                          swingAcc -= 1f;
                      } else if (swingAcc <= -1f) {
                          if (p.swingProgressInt > 0) p.swingProgressInt--;
                          swingAcc += 1f;
                      }
                  } else {
                      swingAcc = 0f;
                  }

                  // Sem animação ao trocar de item
                  if (ModConfig.noReequip && !reflectFailed && mc.getItemRenderer() != null) {
                      try {
                          initReflection();
                          if (!reflectFailed) {
                              ItemRenderer ir = mc.getItemRenderer();
                              fItem.set(ir, p.getHeldItem());
                              fSlot.setInt(ir, p.inventory.currentItem);
                              fEquipped.setFloat(ir, 1.0f);
                              fPrev.setFloat(ir, 1.0f);
                          }
                      } catch (Throwable t) {
                          reflectFailed = true;
                      }
                  }
              }

              @SubscribeEvent
              public void onRenderHand(RenderHandEvent e) {
                  if (!ModConfig.itemCustom) {
                      if (dirty) restore();
                      return;
                  }
                  EntityPlayerSP p = mc.thePlayer;
                  if (p == null) return;
                  ItemStack s = p.getHeldItem();
                  if (s == null) return;
                  try {
                      IBakedModel m = mc.getRenderItem().getItemModelMesher().getItemModel(s);
                      if (m == null) return;
                      ItemTransformVec3f t = m.getItemCameraTransforms().firstPerson;
                      if (t == null || t == ItemTransformVec3f.DEFAULT) return;
                      float[] b = base.get(t);
                      if (b == null) {
                          b = new float[]{
                                  t.translation.x, t.translation.y, t.translation.z,
                                  t.rotation.x, t.rotation.y, t.rotation.z,
                                  t.scale.x, t.scale.y, t.scale.z};
                          base.put(t, b);
                      }
                      set(t, b, ModConfig.itemX, ModConfig.itemY, ModConfig.itemZ,
                              ModConfig.itemRotX, ModConfig.itemRotY, ModConfig.itemRotZ, ModConfig.itemScale / 100f);
                      dirty = true;
                  } catch (Throwable ignored) {
                  }
              }

              private void set(ItemTransformVec3f t, float[] b, int dx, int dy, int dz, int rx, int ry, int rz, float sc) {
                  t.translation.x = b[0] + dx * 0.02f;
                  t.translation.y = b[1] + dy * 0.02f;
                  t.translation.z = b[2] + dz * 0.02f;
                  t.rotation.x = b[3] + rx;
                  t.rotation.y = b[4] + ry;
                  t.rotation.z = b[5] + rz;
                  t.scale.x = b[6] * sc;
                  t.scale.y = b[7] * sc;
                  t.scale.z = b[8] * sc;
              }

              private void restore() {
                  for (Map.Entry<ItemTransformVec3f, float[]> en : base.entrySet()) {
                      set(en.getKey(), en.getValue(), 0, 0, 0, 0, 0, 0, 1f);
                  }
                  dirty = false;
              }
          }
          LEGITEOF
          cat > proj/src/main/java/com/legitclient/Extras.java <<'LEGITEOF'
          package com.legitclient;

          import net.minecraft.block.Block;
          import net.minecraft.block.material.Material;
