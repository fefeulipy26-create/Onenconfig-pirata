          import net.minecraftforge.client.event.DrawBlockHighlightEvent;
          import net.minecraftforge.client.event.FOVUpdateEvent;
          import net.minecraftforge.client.event.RenderBlockOverlayEvent;
          import net.minecraftforge.client.event.RenderGameOverlayEvent;
          import net.minecraftforge.client.event.RenderHandEvent;
          import net.minecraftforge.event.entity.player.AttackEntityEvent;
          import net.minecraftforge.fml.common.eventhandler.SubscribeEvent;
          import net.minecraftforge.fml.common.gameevent.InputEvent;
          import net.minecraftforge.fml.common.gameevent.TickEvent;
          import org.lwjgl.input.Keyboard;
          import org.lwjgl.input.Mouse;
          import org.lwjgl.opengl.GL11;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          /** Módulos extras do client. Todos são visuais/informativos e permitidos (sem hacks). */
          public class Extras {
              private static final long[] TIMES = {0L, 6000L, 12500L, 18000L};
              private static final String[] CARDINALS = {"N", "L", "S", "O"};
              private static final int HIST = 60;

              private final Minecraft mc = Minecraft.getMinecraft();
              private final List<String> lines = new ArrayList<String>();
              private final SimpleDateFormat clock = new SimpleDateFormat("HH:mm:ss");
              private final SimpleDateFormat chatClock = new SimpleDateFormat("HH:mm");

              private double bps, distance;
              private int combo, maxCombo, totalHits, prevHurt, tickCount;
              private long lastHit;
              private double reach = -1;
              private String counters = "";
              private boolean sneakToggled, sneakForced;

              private final long sessionStart = System.currentTimeMillis();
              private long lastBreak = System.currentTimeMillis();
              private boolean deathAnnounced;
              private final boolean[] warned = new boolean[5];

              private final int[] fpsHist = new int[HIST];
              private int fpsIdx, fpsCount;
              private double frameMs = 16;
              private long lastFrameNs;

              private String lastChat = "";
              private long lastChatTime;

              public List<String> getLines() {
                  return lines;
              }

              // =====================================================================
              // Tick: monta as linhas do HUD e aplica ajustes
              // =====================================================================
              @SubscribeEvent
              public void onTick(TickEvent.ClientTickEvent e) {
                  if (e.phase != TickEvent.Phase.END) return;
                  lines.clear();
                  EntityPlayerSP p = mc.thePlayer;
                  WorldClient w = mc.theWorld;
                  if (p == null || w == null) return;
                  try {
                      tickCount++;

                      double dx = p.posX - p.prevPosX, dz = p.posZ - p.prevPosZ;
                      double step = Math.sqrt(dx * dx + dz * dz);
                      bps += (step * 20.0 - bps) * 0.2;
                      if (step < 10.0) distance += step;

                      if (p.hurtTime > prevHurt) combo = 0;
                      prevHurt = p.hurtTime;
                      if (combo > 0 && System.currentTimeMillis() - lastHit > 3000) combo = 0;

                      if (tickCount % 5 == 0) {
                          counters = countItems(p);
                          fpsHist[fpsIdx] = Minecraft.getDebugFPS();
                          fpsIdx = (fpsIdx + 1) % HIST;
                          if (fpsCount < HIST) fpsCount++;
                      }
                      if (tickCount % 20 == 0 && ModConfig.flag("durabaixa")) checkDurability(p);

                      buildLines(p, w);
                      worldTweaks(w);
                      handleSneak();
                      handleAlerts(p);
                  } catch (Throwable ignored) {
                  }
              }

              private void buildLines(EntityPlayerSP p, WorldClient w) {
                  MovingObjectPosition mop = mc.objectMouseOver;

                  if (ModConfig.flag("ping")) {
                      int ping = 0;
                      try {
                          NetworkPlayerInfo info = mc.getNetHandler().getPlayerInfo(p.getUniqueID());
                          if (info != null) ping = info.getResponseTime();
                      } catch (Throwable ignored) {
                      }
                      lines.add("Ping: " + ping + " ms");
                  }
                  if (ModConfig.flag("relogio")) lines.add(clock.format(new Date()));
                  if (ModConfig.flag("sessao")) {
                      long sec = (System.currentTimeMillis() - sessionStart) / 1000L;
                      lines.add(String.format(Locale.US, "Sessão: %02d:%02d:%02d", sec / 3600L, (sec / 60L) % 60L, sec % 60L));
                  }
                  if (ModConfig.flag("dia")) {
                      long t = w.getWorldTime();
                      int tod = (int) (t % 24000L);
                      lines.add(String.format(Locale.US, "Dia %d  %02d:%02d", t / 24000L + 1L,
                              (tod / 1000 + 6) % 24, (tod % 1000) * 60 / 1000));
                  }
                  if (ModConfig.flag("velocidade")) lines.add(String.format(Locale.US, "Velocidade: %.1f b/s", bps));
                  if (ModConfig.flag("distancia")) lines.add(String.format(Locale.US, "Distância: %.0f blocos", distance));
                  if (ModConfig.flag("bioma")) lines.add("Bioma: " + w.getBiomeGenForCoords(new BlockPos(p)).biomeName);
                  if (ModConfig.flag("dimensao")) lines.add("Dimensão: " + w.provider.getDimensionName());
                  if (ModConfig.flag("nether")) {
                      lines.add(String.format(Locale.US, "Nether: %.1f / %.1f", p.posX / 8.0, p.posZ / 8.0));
                  }
                  if (ModConfig.flag("chunk")) {
                      lines.add("Chunk: " + (((int) Math.floor(p.posX)) >> 4) + ", " + (((int) Math.floor(p.posZ)) >> 4));
                  }
                  if (ModConfig.flag("luz")) lines.add("Luz: " + w.getLightFromNeighbors(new BlockPos(p)));
                  if (ModConfig.flag("angulos")) {
                      lines.add(String.format(Locale.US, "Yaw %.1f / Pitch %.1f",
                              MathHelper.wrapAngleTo180_float(p.rotationYaw), p.rotationPitch));
                  }
                  if (ModConfig.flag("servidor")) {
                      ServerData sd = mc.getCurrentServerData();
                      lines.add("Servidor: " + (sd == null ? "Singleplayer" : sd.serverIP));
                  }
                  if (ModConfig.flag("online")) lines.add("Online: " + mc.getNetHandler().getPlayerInfoMap().size());

                  if (ModConfig.flag("blocoalvo") && mop != null
                          && mop.typeOfHit == MovingObjectPosition.MovingObjectType.BLOCK) {
                      Block b = w.getBlockState(mop.getBlockPos()).getBlock();
                      lines.add("Bloco: " + b.getLocalizedName());
                  }
                  if (ModConfig.flag("entalvo") && mop != null
                          && mop.typeOfHit == MovingObjectPosition.MovingObjectType.ENTITY && mop.entityHit != null) {
                      lines.add("Alvo: " + mop.entityHit.getName());
                  }

                  if (ModConfig.flag("vida")) {
                      String v = String.format(Locale.US, "Vida: %.1f / %.0f", p.getHealth(), p.getMaxHealth());
                      if (p.getAbsorptionAmount() > 0f) v += String.format(Locale.US, " (+%.1f)", p.getAbsorptionAmount());
                      lines.add(v);
                  }
                  if (ModConfig.flag("fome")) {
                      lines.add(String.format(Locale.US, "Fome: %d  Saturação: %.1f",
                              p.getFoodStats().getFoodLevel(), p.getFoodStats().getSaturationLevel()));
                  }
                  if (ModConfig.flag("xp")) lines.add("XP: nível " + p.experienceLevel);
                  ItemStack held = p.getHeldItem();
                  if (ModConfig.flag("itemmao") && held != null) {
                      String n = held.getDisplayName();
                      if (held.isItemStackDamageable()) n += " " + (held.getMaxDamage() - held.getItemDamage()) + "/" + held.getMaxDamage();
                      lines.add(n);
                  }
                  if (ModConfig.flag("blocosqtd") && held != null) {
                      int c = 0;
                      for (ItemStack s : p.inventory.mainInventory) {
                          if (s != null && s.isItemEqual(held)) c += s.stackSize;
                      }
                      lines.add("Quantidade: " + c);
                  }
                  if (ModConfig.flag("contadores") && !counters.isEmpty()) lines.add(counters);

                  if (ModConfig.flag("combo")) lines.add("Combo: " + combo);
                  if (ModConfig.flag("alcance")) {
                      lines.add(reach < 0 ? "Alcance: -" : String.format(Locale.US, "Alcance: %.2f", reach));
                  }
                  if (ModConfig.flag("hitstotal")) lines.add("Hits: " + totalHits + "  Combo máx: " + maxCombo);

                  if (ModConfig.flag("memoria")) {
                      Runtime rt = Runtime.getRuntime();
                      long used = (rt.totalMemory() - rt.freeMemory()) >> 20;
                      lines.add("RAM: " + used + "/" + (rt.maxMemory() >> 20) + " MB");
                  }
                  if (ModConfig.flag("frametime")) lines.add(String.format(Locale.US, "Frametime: %.1f ms", frameMs));
                  if (ModConfig.flag("fpsstats") && fpsCount > 0) {
                      int min = Integer.MAX_VALUE, max = 0;
                      long sum = 0;
                      for (int i = 0; i < fpsCount; i++) {
                          int f = fpsHist[i];
                          min = Math.min(min, f);
                          max = Math.max(max, f);
                          sum += f;
                      }
                      lines.add("FPS mín " + min + " / méd " + (sum / fpsCount) + " / máx " + max);
                  }
              }

              private void worldTweaks(WorldClient w) {
                  if (ModConfig.fixedTime > 0 && ModConfig.fixedTime < TIMES.length) {
                      w.setWorldTime(TIMES[ModConfig.fixedTime]);
                  }
                  if (ModConfig.flag("semchuva")) {
                      w.setRainStrength(0f);
                      w.setThunderStrength(0f);
                      w.prevRainingStrength = 0f;
                      w.prevThunderingStrength = 0f;
                  }
              }

              private void handleAlerts(EntityPlayerSP p) {
                  // coordenadas da morte
                  if (p.getHealth() <= 0f || p.deathTime > 0) {
                      if (!deathAnnounced) {
                          deathAnnounced = true;
                          if (ModConfig.flag("morte")) {
                              p.addChatMessage(new ChatComponentText(String.format(Locale.US,
                                      "\u00a7c[Legit Client] \u00a7fVocê morreu em \u00a7e%d %d %d",
                                      (int) p.posX, (int) p.posY, (int) p.posZ)));
                          }
                      }
                  } else {
                      deathAnnounced = false;
                  }

                  // lembrete de pausa
                  if (ModConfig.flag("pausa") && System.currentTimeMillis() - lastBreak > 30L * 60L * 1000L) {
                      lastBreak = System.currentTimeMillis();
                      p.addChatMessage(new ChatComponentText(
                              "\u00a7e[Legit Client] \u00a7fJá faz 30 minutos de jogo. Que tal uma pausa?"));
                  }
              }

              private void checkDurability(EntityPlayerSP p) {
                  for (int i = 0; i < 5; i++) {
                      ItemStack s = i < 4 ? p.inventory.armorInventory[i] : p.getHeldItem();
                      boolean low = false;
                      int pct = 100;
                      if (s != null && s.isItemStackDamageable() && s.getMaxDamage() > 0) {
                          pct = (s.getMaxDamage() - s.getItemDamage()) * 100 / s.getMaxDamage();
                          low = pct < 10;
                      }
                      if (low && !warned[i]) {
                          warned[i] = true;
                          p.addChatMessage(new ChatComponentText("\u00a7e[Legit Client] \u00a7fDurabilidade baixa: \u00a7c"
                                  + s.getDisplayName() + " (" + pct + "%)"));
                      } else if (!low) {
                          warned[i] = false;
                      }
                  }
              }

              private String countItems(EntityPlayerSP p) {
                  int pots = 0, pearls = 0, gaps = 0, arrows = 0, soups = 0;
                  for (ItemStack s : p.inventory.mainInventory) {
                      if (s == null) continue;
                      Item it = s.getItem();
                      if (it == Items.ender_pearl) pearls += s.stackSize;
                      else if (it == Items.golden_apple) gaps += s.stackSize;
                      else if (it == Items.arrow) arrows += s.stackSize;
                      else if (it == Items.mushroom_stew) soups += s.stackSize;
                      else if (it instanceof ItemPotion && ItemPotion.isSplash(s.getMetadata())) {
                          List<PotionEffect> eff = ((ItemPotion) it).getEffects(s);
                          if (eff != null) {
                              for (PotionEffect pe : eff) {
                                  if (pe.getPotionID() == Potion.heal.id) {
                                      pots += s.stackSize;
                                      break;
                                  }
                              }
                          }
                      }
                  }
                  StringBuilder sb = new StringBuilder();
                  if (pots > 0) sb.append("Pots ").append(pots).append("  ");
                  if (soups > 0) sb.append("Sopas ").append(soups).append("  ");
                  if (pearls > 0) sb.append("Pérolas ").append(pearls).append("  ");
                  if (gaps > 0) sb.append("Maçãs ").append(gaps).append("  ");
                  if (arrows > 0) sb.append("Flechas ").append(arrows);
                  return sb.toString().trim();
              }

              // =====================================================================
              // Combate: combo, alcance, hits, partículas e som (cosméticos)
              // =====================================================================
              @SubscribeEvent
              public void onAttack(AttackEntityEvent e) {
                  if (e.entityPlayer != mc.thePlayer) return;
                  combo++;
                  totalHits++;
                  if (combo > maxCombo) maxCombo = combo;
                  lastHit = System.currentTimeMillis();

                  MovingObjectPosition mop = mc.objectMouseOver;
                  if (mop != null && mop.typeOfHit == MovingObjectPosition.MovingObjectType.ENTITY && mop.hitVec != null) {
                      reach = mc.thePlayer.getPositionEyes(1.0F).distanceTo(mop.hitVec);
                  }

                  try {
                      if (e.target != null) {
                          for (int i = 0; i < ModConfig.partCount; i++) {
                              if (ModConfig.flag("critparts")) mc.effectRenderer.emitParticleAtEntity(e.target, EnumParticleTypes.CRIT);
                              if (ModConfig.flag("magparts")) mc.effectRenderer.emitParticleAtEntity(e.target, EnumParticleTypes.CRIT_MAGIC);
                          }
                      }
                      if (ModConfig.flag("somhit")) mc.thePlayer.playSound("random.successful_hit", 0.5F, 1.2F);
                  } catch (Throwable ignored) {
                  }
              }

              // =====================================================================
              // Agachar alternado
              // =====================================================================
              private boolean rawDown(KeyBinding k) {
                  int c = k.getKeyCode();
                  if (c > 0) return Keyboard.isKeyDown(c);
                  if (c < 0) return Mouse.isButtonDown(c + 100);
                  return false;
              }

              private void handleSneak() {
                  KeyBinding k = mc.gameSettings.keyBindSneak;
                  if (!ModConfig.flag("sneaktoggle")) {
                      if (sneakForced) {
                          KeyBinding.setKeyBindState(k.getKeyCode(), rawDown(k));
                          sneakForced = false;
                          sneakToggled = false;
                      }
                      return;
                  }
                  if (mc.currentScreen != null) return;
                  if (k.isPressed()) sneakToggled = !sneakToggled;
                  KeyBinding.setKeyBindState(k.getKeyCode(), sneakToggled || rawDown(k));
                  sneakForced = true;
              }

              @SubscribeEvent
              public void onKey(InputEvent.KeyInputEvent e) {
                  if (ModConfig.flag("sneaktoggle")) handleSneak();
              }

              @SubscribeEvent
              public void onMouse(InputEvent.MouseInputEvent e) {
                  if (ModConfig.flag("sneaktoggle")) handleSneak();
              }

              // =====================================================================
              // Chat: horário, menção, anti-repetição
              // =====================================================================
              @SubscribeEvent
              public void onChat(ClientChatReceivedEvent e) {
                  if (e.message == null || e.type == 2) return;
                  String txt = e.message.getUnformattedText();

                  if (ModConfig.flag("chatdup")) {
                      long now = System.currentTimeMillis();
                      if (txt.equals(lastChat) && now - lastChatTime < 5000L) {
                          lastChatTime = now;
                          e.setCanceled(true);
                          return;
                      }
                      lastChat = txt;
                      lastChatTime = now;
                  }

                  if (ModConfig.flag("mencao") && mc.thePlayer != null) {
                      String n = mc.thePlayer.getName().toLowerCase();
                      String low = txt.toLowerCase();
                      if (low.contains(n) && !low.contains(n + ":") && !low.startsWith("<" + n + ">")) {
                          mc.thePlayer.playSound("note.pling", 1.0F, 1.5F);
                      }
                  }

                  if (ModConfig.flag("chathora")) {
                      ChatComponentText prefix = new ChatComponentText("\u00a77[" + chatClock.format(new Date()) + "] \u00a7r");
                      prefix.appendSibling(e.message);
                      e.message = prefix;
                  }
              }

