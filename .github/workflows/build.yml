              };
              private static final Map<String, Boolean> flags = new HashMap<String, Boolean>();

              public static final int[] COLORS = {0xFFFFFF, 0xFF5555, 0x55FF55, 0x55FFFF, 0xFFFF55, 0xFF55FF, 0x5555FF, 0xFFAA00};
              public static final String[] COLOR_NAMES = {"Branco", "Vermelho", "Verde", "Ciano", "Amarelo", "Rosa", "Azul", "Laranja"};

              public static int hudScale = 100;
              public static int hudColor = 0;
              public static int crossStyle = 0;
              public static int crossColor = 2;
              public static int crossSize = 5;
              public static int outlineColor = 3;
              public static int fixedTime = 0;
              public static int zoomLevel = 4;
              public static int hudX = 0;
              public static int hudY = 0;
              public static int partCount = 1;

              public static boolean flag(String key) {
                  Boolean b = flags.get(key);
                  return b != null && b;
              }

              public static void toggleFlag(String key) {
                  flags.put(key, !flag(key));
              }

              public static int rgb(int idx) {
                  return COLORS[Math.max(0, Math.min(COLORS.length - 1, idx))];
              }

              public static int hudRgb() {
                  if (flag("rainbow")) return hsv((System.currentTimeMillis() % 4000L) / 4000f, 0.65f, 1f);
                  return rgb(hudColor);
              }

              private static int hsv(float h, float s, float v) {
                  int i = (int) (h * 6f);
                  float f = h * 6f - i;
                  float p = v * (1f - s), q = v * (1f - f * s), t = v * (1f - (1f - f) * s);
                  float r, g, b;
                  switch (i % 6) {
                      case 0: r = v; g = t; b = p; break;
                      case 1: r = q; g = v; b = p; break;
                      case 2: r = p; g = v; b = t; break;
                      case 3: r = p; g = q; b = v; break;
                      case 4: r = t; g = p; b = v; break;
                      default: r = v; g = p; b = q; break;
                  }
                  return ((int) (r * 255f) << 16) | ((int) (g * 255f) << 8) | (int) (b * 255f);
              }

              private static Configuration cfg;

              public static void load(File file) {
                  cfg = new Configuration(file);
                  fps = cfg.get("modulos", "fps", true).getBoolean();
                  cps = cfg.get("modulos", "cps", true).getBoolean();
                  coords = cfg.get("modulos", "coordenadas", true).getBoolean();
                  keystrokes = cfg.get("modulos", "keystrokes", true).getBoolean();
                  armor = cfg.get("modulos", "armadura", true).getBoolean();
                  potions = cfg.get("modulos", "pocoes", true).getBoolean();
                  toggleSprint = cfg.get("modulos", "toggleSprint", false).getBoolean();
                  zoom = cfg.get("modulos", "zoom", true).getBoolean();
                  fpsBoostOnStart = cfg.get("fpsboost", "aplicarAoIniciar", false).getBoolean();
                  renderDistance = cfg.get("fpsboost", "distanciaDeRenderizacao", 6).getInt();
                  noReequip = cfg.get("animacoes", "semAnimacaoTrocarItem", false).getBoolean();
                  modernBackwalk = cfg.get("animacoes", "andarDeCostasModerno", false).getBoolean();
                  swingSpeed = cfg.get("animacoes", "velocidadeSwing", 100).getInt();
                  itemCustom = cfg.get("animacoes", "itemPersonalizado", false).getBoolean();
                  itemX = cfg.get("animacoes", "itemX", 0).getInt();
                  itemY = cfg.get("animacoes", "itemY", 0).getInt();
                  itemZ = cfg.get("animacoes", "itemZ", 0).getInt();
                  itemRotX = cfg.get("animacoes", "itemRotX", 0).getInt();
                  itemRotY = cfg.get("animacoes", "itemRotY", 0).getInt();
                  itemRotZ = cfg.get("animacoes", "itemRotZ", 0).getInt();
                  itemScale = cfg.get("animacoes", "itemTamanho", 100).getInt();
                  for (String[] m : EXTRA_MODS) {
                      if (m[0].startsWith("#")) continue;
                      flags.put(m[0], cfg.get("extras", m[0], false).getBoolean());
                  }
                  zoomLevel = Math.max(2, Math.min(10, cfg.get("extras", "nivelZoom", 4).getInt()));
                  hudX = Math.max(0, Math.min(600, cfg.get("extras", "hudX", 0).getInt()));
                  hudY = Math.max(0, Math.min(400, cfg.get("extras", "hudY", 0).getInt()));
                  partCount = Math.max(1, Math.min(5, cfg.get("extras", "particulasPorHit", 1).getInt()));
                  hudScale = Math.max(50, Math.min(200, cfg.get("extras", "tamanhoHud", 100).getInt()));
                  hudColor = cfg.get("extras", "corHud", 0).getInt();
                  crossStyle = Math.max(0, Math.min(2, cfg.get("extras", "miraEstilo", 0).getInt()));
                  crossColor = cfg.get("extras", "miraCor", 2).getInt();
                  crossSize = Math.max(2, Math.min(12, cfg.get("extras", "miraTamanho", 5).getInt()));
                  outlineColor = cfg.get("extras", "contornoCor", 3).getInt();
                  fixedTime = Math.max(0, Math.min(3, cfg.get("extras", "horaFixa", 0).getInt()));
                  if (cfg.hasChanged()) cfg.save();
              }

              public static void save() {
                  if (cfg == null) return;
                  cfg.get("modulos", "fps", true).set(fps);
                  cfg.get("modulos", "cps", true).set(cps);
                  cfg.get("modulos", "coordenadas", true).set(coords);
                  cfg.get("modulos", "keystrokes", true).set(keystrokes);
