                      tab = 1;
                      scroll = 0;
                      return;
                  }
                  if (e.factory == null) {
                      say("Esse mod não tem tela de configuração.");
                      return;
                  }
                  try {
                      GuiScreen s = e.factory.mainConfigGuiClass().getConstructor(GuiScreen.class).newInstance(this);
                      mc.displayGuiScreen(s);
                  } catch (Throwable t) {
                      say("Não foi possível abrir a config desse mod.");
                  }
              }

