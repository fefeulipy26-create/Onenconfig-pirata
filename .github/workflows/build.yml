              @SubscribeEvent
              public void onOverlayPre(RenderGameOverlayEvent.Pre e) {
                  if (e.type == RenderGameOverlayEvent.ElementType.PORTAL && ModConfig.flag("semportal")) {
                      e.setCanceled(true);
                      return;
                  }
                  if (e.type == RenderGameOverlayEvent.ElementType.HELMET && ModConfig.flag("semabobora")) {
                      e.setCanceled(true);
                      return;
                  }
                  if (e.type != RenderGameOverlayEvent.ElementType.CROSSHAIRS || !ModConfig.flag("mira")) return;
                  e.setCanceled(true);
                  if (mc.gameSettings.thirdPersonView != 0) return;

                  ScaledResolution sr = e.resolution;
                  int cx = sr.getScaledWidth() / 2;
                  int cy = sr.getScaledHeight() / 2;
                  int c = 0xFF000000 | ModConfig.rgb(ModConfig.crossColor);
                  int s = ModConfig.crossSize;
                  int g = 2;
                  int shadow = 0x90000000;

                  if (ModConfig.crossStyle == 0 || ModConfig.crossStyle == 2) {
                      Gui.drawRect(cx - g - s - 1, cy - 1, cx - g + 1, cy + 2, shadow);
                      Gui.drawRect(cx + g, cy - 1, cx + g + s + 2, cy + 2, shadow);
                      Gui.drawRect(cx - 1, cy - g - s - 1, cx + 2, cy - g + 1, shadow);
                      Gui.drawRect(cx - 1, cy + g, cx + 2, cy + g + s + 2, shadow);
                      Gui.drawRect(cx - g - s, cy, cx - g, cy + 1, c);
                      Gui.drawRect(cx + 1 + g, cy, cx + 1 + g + s, cy + 1, c);
                      Gui.drawRect(cx, cy - g - s, cx + 1, cy - g, c);
                      Gui.drawRect(cx, cy + 1 + g, cx + 1, cy + 1 + g + s, c);
                  }
                  if (ModConfig.crossStyle == 1 || ModConfig.crossStyle == 2) {
                      Gui.drawRect(cx - 1, cy - 1, cx + 2, cy + 2, shadow);
                      Gui.drawRect(cx, cy, cx + 1, cy + 1, c);
                  }
              }

              // =====================================================================
              // HUD extra: aviso de vida baixa, bússola e gráfico de FPS
              // =====================================================================
              @SubscribeEvent
              public void onRender(RenderGameOverlayEvent.Post e) {
                  if (e.type != RenderGameOverlayEvent.ElementType.ALL) return;

                  long now = System.nanoTime();
                  if (lastFrameNs != 0L) frameMs += ((now - lastFrameNs) / 1000000.0 - frameMs) * 0.1;
                  lastFrameNs = now;

                  EntityPlayerSP p = mc.thePlayer;
                  if (p == null || mc.gameSettings.showDebugInfo) return;
                  ScaledResolution sr = e.resolution;
                  FontRenderer fr = mc.fontRendererObj;

                  if (ModConfig.flag("vidabaixa")) drawLowHealth(sr, p);
                  if (ModConfig.flag("bussola")) drawCompass(sr, p, fr);
                  if (ModConfig.flag("fpsgraph")) drawGraph(sr, fr);
              }

              private void drawLowHealth(ScaledResolution sr, EntityPlayerSP p) {
                  float hp = p.getHealth();
                  if (hp <= 0f || hp > 6f) return;
                  int w = sr.getScaledWidth(), h = sr.getScaledHeight();
                  double pulse = 0.65 + 0.35 * Math.sin(System.currentTimeMillis() / 180.0);
                  for (int i = 0; i < 6; i++) {
                      int a = (int) (0x70 * pulse * (1.0 - i / 6.0));
                      int col = (a << 24) | 0xFF0000;
                      int o = i * 3;
                      Gui.drawRect(0, o, w, o + 3, col);
                      Gui.drawRect(0, h - o - 3, w, h - o, col);
                      Gui.drawRect(o, o + 3, o + 3, h - o - 3, col);
                      Gui.drawRect(w - o - 3, o + 3, w - o, h - o - 3, col);
                  }
              }

              private void drawCompass(ScaledResolution sr, EntityPlayerSP p, FontRenderer fr) {
                  int cx = sr.getScaledWidth() / 2;
                  float bearing = (MathHelper.wrapAngleTo180_float(p.rotationYaw) + 180f + 360f) % 360f;
                  Gui.drawRect(cx - 100, 2, cx + 100, 15, 0x55000000);
                  for (int d = 0; d < 360; d += 15) {
                      float delta = MathHelper.wrapAngleTo180_float(d - bearing);
                      if (Math.abs(delta) > 75f) continue;
                      int x = cx + (int) (delta * 1.3f);
                      if (d % 90 == 0) {
                          String lab = CARDINALS[d / 90];
                          fr.drawStringWithShadow(lab, x - fr.getStringWidth(lab) / 2, 5, d == 0 ? 0xFF5555 : 0xFFFFFF);
                      } else {
                          Gui.drawRect(x, 6, x + 1, 11, 0xAAFFFFFF);
                      }
                  }
                  Gui.drawRect(cx, 15, cx + 1, 19, 0xFF2D6FF7);
                  String deg = String.valueOf((int) bearing) + "\u00b0";
                  fr.drawStringWithShadow(deg, cx - fr.getStringWidth(deg) / 2, 20, 0xFFFFFF);
              }

              private void drawGraph(ScaledResolution sr, FontRenderer fr) {
                  int x = sr.getScaledWidth() - HIST - 6;
                  int y = sr.getScaledHeight() - 44;
                  int h = 30;
                  Gui.drawRect(x - 2, y - 11, x + HIST + 2, y + h + 2, 0x66000000);
                  fr.drawString("FPS", x, y - 9, 0xFFFFFF);
                  for (int i = 0; i < fpsCount; i++) {
                      int idx = (fpsIdx - fpsCount + i + HIST * 2) % HIST;
                      int f = fpsHist[idx];
                      int bh = (int) (Math.min(1.0f, f / 120.0f) * h);
                      if (bh < 1) bh = 1;
                      int col = f >= 60 ? 0xFF55FF55 : (f >= 30 ? 0xFFFFFF55 : 0xFFFF5555);
                      int bx = x + (HIST - fpsCount) + i;
                      Gui.drawRect(bx, y + h - bh, bx + 1, y + h, col);
                  }
              }

              // =====================================================================
              // Contorno de bloco colorido
              // =====================================================================
              @SubscribeEvent
              public void onBlockHighlight(DrawBlockHighlightEvent e) {
                  if (!ModConfig.flag("contorno")) return;
                  MovingObjectPosition t = e.target;
                  if (t == null || t.typeOfHit != MovingObjectPosition.MovingObjectType.BLOCK || mc.theWorld == null) return;
                  try {
                      BlockPos pos = t.getBlockPos();
                      Block b = mc.theWorld.getBlockState(pos).getBlock();
                      if (b.getMaterial() == Material.air) return;
                      b.setBlockBoundsBasedOnState(mc.theWorld, pos);

                      EntityPlayer pl = e.player;
                      double ox = pl.lastTickPosX + (pl.posX - pl.lastTickPosX) * e.partialTicks;
                      double oy = pl.lastTickPosY + (pl.posY - pl.lastTickPosY) * e.partialTicks;
                      double oz = pl.lastTickPosZ + (pl.posZ - pl.lastTickPosZ) * e.partialTicks;
                      AxisAlignedBB bb = b.getSelectedBoundingBox(mc.theWorld, pos)
                              .expand(0.002D, 0.002D, 0.002D).offset(-ox, -oy, -oz);

                      int rgb = ModConfig.rgb(ModConfig.outlineColor);
                      GlStateManager.enableBlend();
                      GlStateManager.tryBlendFuncSeparate(770, 771, 1, 0);
                      GlStateManager.color(((rgb >> 16) & 255) / 255f, ((rgb >> 8) & 255) / 255f, (rgb & 255) / 255f, 0.9f);
                      GL11.glLineWidth(2.0F);
                      GlStateManager.disableTexture2D();
                      GlStateManager.depthMask(false);
                      RenderGlobal.drawSelectionBoundingBox(bb);
                      GlStateManager.depthMask(true);
                      GlStateManager.enableTexture2D();
                      GlStateManager.disableBlend();
                      GlStateManager.color(1f, 1f, 1f, 1f);
                      e.setCanceled(true);
                  } catch (Throwable ignored) {
                  }
              }
          }
