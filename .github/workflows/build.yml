                      return;
                  }
                  Gui.drawRect(x, y + r, x + w, y + h - r, c);
                  for (int i = 0; i < r; i++) {
                      double dy = r - i - 0.5;
                      int inset = r - (int) Math.round(Math.sqrt(r * r - dy * dy));
                      Gui.drawRect(x + inset, y + i, x + w - inset, y + i + 1, c);
                      Gui.drawRect(x + inset, y + h - 1 - i, x + w - inset, y + h - i, c);
