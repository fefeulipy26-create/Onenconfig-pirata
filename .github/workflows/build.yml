              @SubscribeEvent
              public void onTick(TickEvent.ClientTickEvent e) {
                  if (e.phase != TickEvent.Phase.END) return;

                  // CPS (só conta com o jogo em foco, sem tela aberta)
                  long now = System.currentTimeMillis();
                  boolean l = Mouse.isButtonDown(0);
                  boolean r = Mouse.isButtonDown(1);
                  if (mc.currentScreen == null) {
                      if (l && !lastLeft) leftClicks.add(now);
                      if (r && !lastRight) rightClicks.add(now);
                  }
                  lastLeft = l;
                  lastRight = r;
                  while (!leftClicks.isEmpty() && now - leftClicks.getFirst() > 1000) leftClicks.removeFirst();
                  while (!rightClicks.isEmpty() && now - rightClicks.getFirst() > 1000) rightClicks.removeFirst();

                  // Menu
                  if (KEY_MENU.isPressed()) openMenu = true;
                  if (openMenu && (mc.currentScreen == null || !(mc.currentScreen instanceof MenuScreen))) {
                      openMenu = false;
                      mc.displayGuiScreen(new MenuScreen());
                  }

                  if (mc.thePlayer == null) return;

                  // Toggle sprint: equivale a segurar a tecla de sprint enquanto anda pra frente
                  int sprintCode = mc.gameSettings.keyBindSprint.getKeyCode();
                  if (ModConfig.toggleSprint && mc.currentScreen == null
                          && mc.gameSettings.keyBindForward.isKeyDown() && !mc.thePlayer.isSneaking()) {
                      KeyBinding.setKeyBindState(sprintCode, true);
                      forcedSprint = true;
                  } else if (forcedSprint) {
                      KeyBinding.setKeyBindState(sprintCode, false);
                      forcedSprint = false;
                  }

                  // Zoom (FOV menor + câmera suave, igual ao zoom de OptiFine)
                  boolean wantZoom = ModConfig.zoom && mc.currentScreen == null && KEY_ZOOM.isKeyDown();
                  if (wantZoom && !zooming) {
                      savedFov = mc.gameSettings.fovSetting;
                      savedSmooth = mc.gameSettings.smoothCamera;
                      mc.gameSettings.fovSetting = Math.max(5f, savedFov / ModConfig.zoomLevel);
                      mc.gameSettings.smoothCamera = !ModConfig.flag("zoomduro");
                      zooming = true;
                  } else if (!wantZoom && zooming) {
                      mc.gameSettings.fovSetting = savedFov;
                      mc.gameSettings.smoothCamera = savedSmooth;
                      zooming = false;
                  }
              }

              @SubscribeEvent
              public void onRender(RenderGameOverlayEvent.Post e) {
                  if (e.type != RenderGameOverlayEvent.ElementType.ALL) return;
                  if (mc.thePlayer == null || mc.gameSettings.showDebugInfo) return;

                  FontRenderer fr = mc.fontRendererObj;
                  ScaledResolution sr = e.resolution;
                  int col = ModConfig.hudRgb();
                  boolean shadow = !ModConfig.flag("semsombra");

                  List<String> left = new ArrayList<String>();
                  if (ModConfig.fps) left.add("FPS: " + Minecraft.getDebugFPS());
                  if (ModConfig.cps) left.add("CPS: " + leftClicks.size() + " | " + rightClicks.size());
                  if (ModConfig.coords) {
                      left.add(String.format("XYZ: %.1f / %.1f / %.1f",
                              mc.thePlayer.posX, mc.thePlayer.posY, mc.thePlayer.posZ));
                      left.add("Direção: " + mc.thePlayer.getHorizontalFacing().getName());
                  }
                  left.addAll(extras.getLines());

                  float sc = ModConfig.hudScale / 100f;
                  GlStateManager.pushMatrix();
                  GlStateManager.translate((float) ModConfig.hudX, (float) ModConfig.hudY, 0f);
                  GlStateManager.scale(sc, sc, 1f);

                  if (ModConfig.flag("hudfundo") && !left.isEmpty()) {
                      int wmax = 0;
                      for (String l : left) wmax = Math.max(wmax, fr.getStringWidth(l));
                      Gui.drawRect(2, 2, wmax + 6, 4 + left.size() * 10, 0x60000000);
                  }
                  int y = 4;
                  for (String l : left) {
                      fr.drawString(l, 4, y, col, shadow);
                      y += 10;
                  }

                  if (ModConfig.keystrokes) drawKeystrokes(4, y + 6);
                  GlStateManager.popMatrix();

                  if (ModConfig.armor) drawArmor(sr);
                  if (ModConfig.potions) drawPotions(sr);
              }

              private void box(int x, int y, int w, int h, String label, boolean down) {
                  FontRenderer fr = mc.fontRendererObj;
                  Gui.drawRect(x, y, x + w, y + h, down ? 0x99FFFFFF : 0x66000000);
                  fr.drawString(label, x + (w - fr.getStringWidth(label)) / 2, y + (h - 8) / 2,
                          down ? 0x000000 : 0xFFFFFF);
              }

              private void drawKeystrokes(int x, int y) {
                  int s = 18;
                  box(x + 20, y, s, s, "W", mc.gameSettings.keyBindForward.isKeyDown());
                  box(x, y + 20, s, s, "A", mc.gameSettings.keyBindLeft.isKeyDown());
                  box(x + 20, y + 20, s, s, "S", mc.gameSettings.keyBindBack.isKeyDown());
                  box(x + 40, y + 20, s, s, "D", mc.gameSettings.keyBindRight.isKeyDown());
                  box(x, y + 40, 29, s, "L " + leftClicks.size(), Mouse.isButtonDown(0));
                  box(x + 31, y + 40, 29, s, "R " + rightClicks.size(), Mouse.isButtonDown(1));
                  box(x, y + 60, 60, 10, "", mc.gameSettings.keyBindJump.isKeyDown());
              }

              private void drawArmor(ScaledResolution sr) {
                  FontRenderer fr = mc.fontRendererObj;
                  ItemStack[] stacks = new ItemStack[]{
                          mc.thePlayer.inventory.armorInventory[3],
                          mc.thePlayer.inventory.armorInventory[2],
                          mc.thePlayer.inventory.armorInventory[1],
                          mc.thePlayer.inventory.armorInventory[0],
                          mc.thePlayer.getHeldItem()
                  };
                  int x = sr.getScaledWidth() - 20;
                  int y = sr.getScaledHeight() / 2 - 45;

                  for (ItemStack s : stacks) {
                      if (s != null) {
                          GlStateManager.pushMatrix();
                          RenderHelper.enableGUIStandardItemLighting();
                          mc.getRenderItem().renderItemAndEffectIntoGUI(s, x, y);
                          RenderHelper.disableStandardItemLighting();
                          GlStateManager.popMatrix();
                          if (s.isItemStackDamageable()) {
                              String t = ModConfig.flag("armorpct")
                                      ? ((s.getMaxDamage() - s.getItemDamage()) * 100 / Math.max(1, s.getMaxDamage())) + "%"
                                      : String.valueOf(s.getMaxDamage() - s.getItemDamage());
                              fr.drawStringWithShadow(t, x - fr.getStringWidth(t) - 2, y + 4, 0xFFFFFF);
                          }
                      }
                      y += 18;
                  }
              }

              private void drawPotions(ScaledResolution sr) {
                  FontRenderer fr = mc.fontRendererObj;
                  int y = 4;
                  for (Object o : mc.thePlayer.getActivePotionEffects()) {
                      PotionEffect pe = (PotionEffect) o;
                      String name = I18n.format(pe.getEffectName());
                      if (pe.getAmplifier() > 0) name += " " + (pe.getAmplifier() + 1);
                      String t = name + " " + Potion.getDurationString(pe);
                      fr.drawStringWithShadow(t, sr.getScaledWidth() - fr.getStringWidth(t) - 4, y, 0xFFFFFF);
                      y += 10;
                  }
              }
          }
