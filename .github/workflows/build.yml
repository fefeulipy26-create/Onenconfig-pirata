              public static int itemScale = 100;

              // módulos extras (ligam/desligam por chave)
              public static final String[][] EXTRA_MODS = {
                      {"#", "Informações"},
                      {"ping", "Ping"},
                      {"relogio", "Relógio"},
                      {"sessao", "Tempo de sessão"},
                      {"dia", "Dia e hora do jogo"},
