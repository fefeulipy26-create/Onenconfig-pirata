                      @Override
                      public String getCommandUsage(ICommandSender sender) {
                          return "/lc [modulo|lista]";
                      }

                      @Override
                      public void processCommand(ICommandSender sender, String[] args) {
                          if (args.length == 0) {
                              openMenu = true;
                              return;
                          }
                          String key = args[0].toLowerCase();
                          if (key.equals("lista")) {
                              StringBuilder sb = new StringBuilder("\u00a7e[Legit Client] \u00a7fMódulos: ");
                              for (String[] m : ModConfig.EXTRA_MODS) {
                                  if (!m[0].startsWith("#")) sb.append(m[0]).append(' ');
                              }
                              sender.addChatMessage(new ChatComponentText(sb.toString()));
                              return;
                          }
                          for (String[] m : ModConfig.EXTRA_MODS) {
                              if (m[0].equals(key)) {
                                  ModConfig.toggleFlag(key);
                                  ModConfig.save();
                                  sender.addChatMessage(new ChatComponentText("\u00a7e[Legit Client] \u00a7f" + m[1] + ": "
                                          + (ModConfig.flag(key) ? "\u00a7aligado" : "\u00a7cdesligado")));
