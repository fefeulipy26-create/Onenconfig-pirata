                  });
              }

              private void flagRow(FontRenderer fr, int x, int y, int w, String label, final String key) {
                  boolean hov = over(x, y, w, 26) && inView(mx, my);
                  rr(x, y, w, 26, 5, hov ? CARD_HOVER : CARD);
                  fr.drawStringWithShadow(fr.trimStringToWidth(label, w - 44), x + 8, y + 9, TXT);
                  boolean on = ModConfig.flag(key);
                  rr(x + w - 32, y + 7, 24, 12, 6, on ? ACCENT : OFF);
                  rr(on ? x + w - 20 : x + w - 31, y + 8, 10, 10, 5, TXT);
                  hit(x, y, w, 26, new Runnable() {
                      @Override
                      public void run() {
                          ModConfig.toggleFlag(key);
                      }
                  });
              }

              private void drawClient(FontRenderer fr) {
                  int cols = vw >= 250 ? 2 : 1;
                  int cw = (vw - (cols - 1) * 6) / cols;
                  String q = search == null ? "" : search.getText().trim().toLowerCase();
                  boolean searching = !q.isEmpty();

                  List<String[]> items = new ArrayList<String[]>();
                  if (!searching) items.add(new String[]{"#", "Principais"});
                  for (int i = 0; i < TOGGLES.length; i++) {
                      if (!searching || TOGGLES[i].toLowerCase().contains(q)) items.add(new String[]{"c" + i, TOGGLES[i]});
                  }
                  for (String[] m : ModConfig.EXTRA_MODS) {
                      if (m[0].startsWith("#")) {
                          if (!searching) items.add(m);
                      } else if (!searching || m[1].toLowerCase().contains(q)) {
                          items.add(m);
                      }
                  }

                  int yy = 0, col = 0;
                  for (String[] it : items) {
                      if (it[0].startsWith("#")) {
                          if (col != 0) {
                              col = 0;
                              yy += 32;
                          }
                          int hy = vy + yy - scroll;
                          if (!(hy + 14 < vy || hy > vy + vh)) fr.drawStringWithShadow(it[1], vx + 2, hy + 4, ACCENT);
                          yy += 18;
                          continue;
                      }
                      int x = vx + col * (cw + 6);
                      int y = vy + yy - scroll;
                      if (!(y + 26 < vy || y > vy + vh)) {
                          if (it[0].matches("c\\d+")) {
                              switchRow(fr, x, y, cw, it[1], Integer.parseInt(it[0].substring(1)));
                          } else {
                              flagRow(fr, x, y, cw, it[1], it[0]);
                          }
                      }
                      col++;
                      if (col == cols) {
                          col = 0;
                          yy += 32;
                      }
                  }
                  if (col != 0) yy += 32;
                  if (items.isEmpty()) fr.drawString("Nenhum módulo encontrado.", vx + 4, vy + 6, SUB);
                  contentH = yy;
              }

              // ---------- aba FPS ----------
              private void drawFps(FontRenderer fr) {
                  int y = vy - scroll;
                  int w = vw;

                  @SuppressWarnings("unchecked")
                  List<String> lines = fr.listFormattedStringToWidth(
                          "Ajusta só as opções de vídeo do próprio jogo: gráficos rápidos, sem nuvens, "
                                  + "menos partículas, sem AO e sombras, VBO ligado e vsync desligado.", w - 16);
                  int ch = 10 + lines.size() * 10;
                  rr(vx, y, w, ch, 5, CARD);
                  for (int i = 0; i < lines.size(); i++) {
                      fr.drawString(lines.get(i), vx + 8, y + 7 + i * 10, SUB);
                  }
                  y += ch + 6;

                  boolean hov = over(vx, y, w, 24) && inView(mx, my);
                  rr(vx, y, w, 24, 5, hov ? 0xFF4A82FF : ACCENT);
                  drawCenteredString(fr, "Aplicar FPS boost agora", vx + w / 2, y + 8, TXT);
                  hit(vx, y, w, 24, new Runnable() {
                      @Override
                      public void run() {
                          FpsBoost.apply();
                          say("FPS boost aplicado!");
                      }
                  });
                  y += 30;

                  switchRow(fr, vx, y, w, "Aplicar ao iniciar o jogo", 8);
                  y += 32;

                  rr(vx, y, w, 26, 5, CARD);
                  fr.drawStringWithShadow("Distância máx.: " + ModConfig.renderDistance + " chunks", vx + 8, y + 9, TXT);
                  int bx = vx + w - 44;
                  rr(bx, y + 5, 16, 16, 4, over(bx, y + 5, 16, 16) ? CARD_HOVER : OFF);
                  drawCenteredString(fr, "-", bx + 8, y + 9, TXT);
                  hit(bx, y + 5, 16, 16, new Runnable() {
                      @Override
                      public void run() {
                          ModConfig.renderDistance = Math.max(2, ModConfig.renderDistance - 1);
                      }
                  });
                  int bx2 = vx + w - 24;
                  rr(bx2, y + 5, 16, 16, 4, over(bx2, y + 5, 16, 16) ? CARD_HOVER : OFF);
                  drawCenteredString(fr, "+", bx2 + 8, y + 9, TXT);
                  hit(bx2, y + 5, 16, 16, new Runnable() {
                      @Override
                      public void run() {
                          ModConfig.renderDistance = Math.min(16, ModConfig.renderDistance + 1);
                      }
                  });
                  y += 32;

                  fr.drawString("FPS atual: " + net.minecraft.client.Minecraft.getDebugFPS(), vx + 2, y + 2, SUB);
                  contentH = (y + 14) - (vy - scroll);
              }

              // ---------- aba Anim (estilo OverflowAnimations) ----------
              private static int clamp(int v, int lo, int hi) {
                  return Math.max(lo, Math.min(hi, v));
              }

              private static String sgn(int v) {
                  return v > 0 ? "+" + v : String.valueOf(v);
              }

              private void stepRow(FontRenderer fr, int x, int y, int w, String text,
                                   final Runnable minus, final Runnable plus) {
                  rr(x, y, w, 26, 5, CARD);
                  fr.drawStringWithShadow(fr.trimStringToWidth(text, w - 56), x + 8, y + 9, TXT);
                  int bx = x + w - 44;
                  rr(bx, y + 5, 16, 16, 4, over(bx, y + 5, 16, 16) && inView(mx, my) ? CARD_HOVER : OFF);
                  drawCenteredString(fr, "-", bx + 8, y + 9, TXT);
                  hit(bx, y + 5, 16, 16, minus);
                  int bx2 = x + w - 24;
                  rr(bx2, y + 5, 16, 16, 4, over(bx2, y + 5, 16, 16) && inView(mx, my) ? CARD_HOVER : OFF);
                  drawCenteredString(fr, "+", bx2 + 8, y + 9, TXT);
                  hit(bx2, y + 5, 16, 16, plus);
              }

              private void drawAnim(FontRenderer fr) {
                  int cols = vw >= 320 ? 2 : 1;
                  int cw = (vw - (cols - 1) * 6) / cols;
                  final int total = 11;
                  for (int i = 0; i < total; i++) {
                      int x = vx + (i % cols) * (cw + 6);
                      int y = vy + (i / cols) * 32 - scroll;
                      boolean visible = !(y + 26 < vy || y > vy + vh);
                      if (!visible) continue;
                      switch (i) {
                          case 0:
                              switchRow(fr, x, y, cw, "Sem animação ao trocar item", 9);
                              break;
                          case 1:
                              stepRow(fr, x, y, cw, "Velocidade do swing: " + ModConfig.swingSpeed + "%",
                                      new Runnable() { public void run() { ModConfig.swingSpeed = clamp(ModConfig.swingSpeed - 25, 25, 300); } },
                                      new Runnable() { public void run() { ModConfig.swingSpeed = clamp(ModConfig.swingSpeed + 25, 25, 300); } });
                              break;
                          case 2:
                              switchRow(fr, x, y, cw, "Item personalizado (1ª pessoa)", 10);
                              break;
                          case 3:
                              stepRow(fr, x, y, cw, "Posição X: " + sgn(ModConfig.itemX),
                                      new Runnable() { public void run() { ModConfig.itemX = clamp(ModConfig.itemX - 1, -40, 40); } },
                                      new Runnable() { public void run() { ModConfig.itemX = clamp(ModConfig.itemX + 1, -40, 40); } });
                              break;
                          case 4:
                              stepRow(fr, x, y, cw, "Posição Y: " + sgn(ModConfig.itemY),
                                      new Runnable() { public void run() { ModConfig.itemY = clamp(ModConfig.itemY - 1, -40, 40); } },
                                      new Runnable() { public void run() { ModConfig.itemY = clamp(ModConfig.itemY + 1, -40, 40); } });
                              break;
                          case 5:
                              stepRow(fr, x, y, cw, "Posição Z: " + sgn(ModConfig.itemZ),
                                      new Runnable() { public void run() { ModConfig.itemZ = clamp(ModConfig.itemZ - 1, -40, 40); } },
                                      new Runnable() { public void run() { ModConfig.itemZ = clamp(ModConfig.itemZ + 1, -40, 40); } });
                              break;
                          case 6:
                              stepRow(fr, x, y, cw, "Rotação X: " + ModConfig.itemRotX + "°",
                                      new Runnable() { public void run() { ModConfig.itemRotX = clamp(ModConfig.itemRotX - 5, -180, 180); } },
                                      new Runnable() { public void run() { ModConfig.itemRotX = clamp(ModConfig.itemRotX + 5, -180, 180); } });
                              break;
                          case 7:
                              stepRow(fr, x, y, cw, "Rotação Y: " + ModConfig.itemRotY + "°",
                                      new Runnable() { public void run() { ModConfig.itemRotY = clamp(ModConfig.itemRotY - 5, -180, 180); } },
                                      new Runnable() { public void run() { ModConfig.itemRotY = clamp(ModConfig.itemRotY + 5, -180, 180); } });
                              break;
                          case 8:
                              stepRow(fr, x, y, cw, "Rotação Z: " + ModConfig.itemRotZ + "°",
                                      new Runnable() { public void run() { ModConfig.itemRotZ = clamp(ModConfig.itemRotZ - 5, -180, 180); } },
                                      new Runnable() { public void run() { ModConfig.itemRotZ = clamp(ModConfig.itemRotZ + 5, -180, 180); } });
                              break;
                          case 10:
                              switchRow(fr, x, y, cw, "Andar de costas moderno", 11);
                              break;
                          case 9:
                              stepRow(fr, x, y, cw, "Tamanho: " + ModConfig.itemScale + "%",
                                      new Runnable() { public void run() { ModConfig.itemScale = clamp(ModConfig.itemScale - 5, 30, 200); } },
                                      new Runnable() { public void run() { ModConfig.itemScale = clamp(ModConfig.itemScale + 5, 30, 200); } });
                              break;
                      }
                  }

                  int y = vy + ((total + cols - 1) / cols) * 32 - scroll;
                  boolean hov = over(vx, y, vw, 24) && inView(mx, my);
                  rr(vx, y, vw, 24, 5, hov ? 0xFF4A82FF : ACCENT);
                  drawCenteredString(fr, "Resetar item", vx + vw / 2, y + 8, TXT);
                  hit(vx, y, vw, 24, new Runnable() {
                      @Override
                      public void run() {
                          ModConfig.itemX = 0;
                          ModConfig.itemY = 0;
                          ModConfig.itemZ = 0;
                          ModConfig.itemRotX = 0;
                          ModConfig.itemRotY = 0;
                          ModConfig.itemRotZ = 0;
                          ModConfig.itemScale = 100;
                          say("Item resetado.");
                      }
                  });
                  fr.drawString("Os ajustes de item valem pro item na mão.", vx + 2, y + 30, SUB);
                  contentH = (y + 42) - (vy - scroll);
              }

              // ---------- aba Extras ----------
              private static final String[] CROSS_STYLES = {"Cruz", "Ponto", "Cruz + ponto"};
              private static final String[] TIMES = {"Desligada", "Dia", "Pôr do sol", "Noite"};

              private static int cyc(int v, int n, int d) {
                  return (v + d + n) % n;
              }

              private void drawExtras(FontRenderer fr) {
                  int cols = vw >= 320 ? 2 : 1;
                  int cw = (vw - (cols - 1) * 6) / cols;
                  final int total = 11;
                  for (int i = 0; i < total; i++) {
                      int x = vx + (i % cols) * (cw + 6);
                      int y = vy + (i / cols) * 32 - scroll;
                      if (y + 26 < vy || y > vy + vh) continue;
                      int nc = ModConfig.COLORS.length;
                      switch (i) {
                          case 0:
                              stepRow(fr, x, y, cw, "Cor do HUD: " + ModConfig.COLOR_NAMES[cyc(ModConfig.hudColor, nc, 0)],
                                      () -> ModConfig.hudColor = cyc(ModConfig.hudColor, ModConfig.COLORS.length, -1),
                                      () -> ModConfig.hudColor = cyc(ModConfig.hudColor, ModConfig.COLORS.length, 1));
                              break;
                          case 1:
                              stepRow(fr, x, y, cw, "Tamanho do HUD: " + ModConfig.hudScale + "%",
                                      () -> ModConfig.hudScale = clamp(ModConfig.hudScale - 10, 50, 200),
                                      () -> ModConfig.hudScale = clamp(ModConfig.hudScale + 10, 50, 200));
                              break;
                          case 2:
                              stepRow(fr, x, y, cw, "Mira: " + CROSS_STYLES[ModConfig.crossStyle],
                                      () -> ModConfig.crossStyle = cyc(ModConfig.crossStyle, 3, -1),
                                      () -> ModConfig.crossStyle = cyc(ModConfig.crossStyle, 3, 1));
                              break;
                          case 3:
                              stepRow(fr, x, y, cw, "Cor da mira: " + ModConfig.COLOR_NAMES[cyc(ModConfig.crossColor, nc, 0)],
                                      () -> ModConfig.crossColor = cyc(ModConfig.crossColor, ModConfig.COLORS.length, -1),
                                      () -> ModConfig.crossColor = cyc(ModConfig.crossColor, ModConfig.COLORS.length, 1));
                              break;
                          case 4:
                              stepRow(fr, x, y, cw, "Tamanho da mira: " + ModConfig.crossSize,
                                      () -> ModConfig.crossSize = clamp(ModConfig.crossSize - 1, 2, 12),
                                      () -> ModConfig.crossSize = clamp(ModConfig.crossSize + 1, 2, 12));
                              break;
                          case 5:
                              stepRow(fr, x, y, cw, "Cor do contorno: " + ModConfig.COLOR_NAMES[cyc(ModConfig.outlineColor, nc, 0)],
                                      () -> ModConfig.outlineColor = cyc(ModConfig.outlineColor, ModConfig.COLORS.length, -1),
                                      () -> ModConfig.outlineColor = cyc(ModConfig.outlineColor, ModConfig.COLORS.length, 1));
                              break;
                          case 6:
                              stepRow(fr, x, y, cw, "Hora fixa: " + TIMES[ModConfig.fixedTime],
                                      () -> ModConfig.fixedTime = cyc(ModConfig.fixedTime, 4, -1),
                                      () -> ModConfig.fixedTime = cyc(ModConfig.fixedTime, 4, 1));
                              break;
                          case 7:
                              stepRow(fr, x, y, cw, "Nível de zoom: " + ModConfig.zoomLevel + "x",
                                      () -> ModConfig.zoomLevel = clamp(ModConfig.zoomLevel - 1, 2, 10),
                                      () -> ModConfig.zoomLevel = clamp(ModConfig.zoomLevel + 1, 2, 10));
                              break;
                          case 8:
                              stepRow(fr, x, y, cw, "HUD posição X: " + ModConfig.hudX,
                                      () -> ModConfig.hudX = clamp(ModConfig.hudX - 5, 0, 600),
                                      () -> ModConfig.hudX = clamp(ModConfig.hudX + 5, 0, 600));
                              break;
                          case 9:
                              stepRow(fr, x, y, cw, "HUD posição Y: " + ModConfig.hudY,
                                      () -> ModConfig.hudY = clamp(ModConfig.hudY - 5, 0, 400),
                                      () -> ModConfig.hudY = clamp(ModConfig.hudY + 5, 0, 400));
                              break;
                          case 10:
                              stepRow(fr, x, y, cw, "Partículas por hit: " + ModConfig.partCount,
                                      () -> ModConfig.partCount = clamp(ModConfig.partCount - 1, 1, 5),
                                      () -> ModConfig.partCount = clamp(ModConfig.partCount + 1, 1, 5));
                              break;
                      }
                  }
                  int y = vy + ((total + cols - 1) / cols) * 32 - scroll;
                  fr.drawString("Ligue os módulos na aba Client.", vx + 2, y + 2, SUB);
                  contentH = (y + 14) - (vy - scroll);
              }

              // ---------- entrada (mouse com arrastar pra rolar, bom pra touch) ----------
              @Override
              protected void mouseClicked(int x, int y, int button) throws IOException {
                  pressed = true;
                  dragMoved = false;
                  pressX = x;
                  pressY = y;
                  lastDragY = y;
                  if (search != null) {
                      search.setFocused((tab == 0 || tab == 1) && x >= sx && x < sx + sww && y >= sy && y < sy + 18);
                  }
              }

              @Override
              protected void mouseClickMove(int x, int y, int button, long time) {
                  if (!pressed) return;
                  if (Math.abs(x - pressX) > 4 || Math.abs(y - pressY) > 4) dragMoved = true;
                  if (dragMoved && inView(pressX, pressY)) {
                      scroll -= (y - lastDragY);
                      int max = Math.max(0, contentH - vh);
                      if (scroll < 0) scroll = 0;
                      if (scroll > max) scroll = max;
                  }
                  lastDragY = y;
              }

              @Override
              protected void mouseReleased(int x, int y, int state) {
                  if (pressed && !dragMoved) {
                      for (int i = hits.size() - 1; i >= 0; i--) {
                          Hit h = hits.get(i);
                          if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) {
                              if (!h.clip || inView(x, y)) {
                                  h.r.run();
                                  break;
                              }
                          }
                      }
                  }
                  pressed = false;
              }

              @Override
              public void handleMouseInput() throws IOException {
                  super.handleMouseInput();
                  int d = Mouse.getEventDWheel();
                  if (d != 0) {
                      scroll -= Integer.signum(d) * 20;
                      int max = Math.max(0, contentH - vh);
                      if (scroll < 0) scroll = 0;
                      if (scroll > max) scroll = max;
                  }
              }

              @Override
              protected void keyTyped(char c, int key) throws IOException {
                  if (search != null && search.isFocused() && key != Keyboard.KEY_ESCAPE) {
                      search.textboxKeyTyped(c, key);
                      lastSearch = search.getText();
                      scroll = 0;
                      return;
                  }
                  super.keyTyped(c, key);
              }
          }
          LEGITEOF

      - name: Instalar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> $GITHUB_PATH

      - name: Compilar
        working-directory: proj
        run: gradle setupCIWorkspace build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LegitClient
          path: proj/build/libs/LegitClient-1.0.0.jar
