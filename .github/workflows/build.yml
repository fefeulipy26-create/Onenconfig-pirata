name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Criar projeto
        run: |
          mkdir -p proj/src/main/java/com/legitclient proj/src/main/resources

          cat > proj/build.gradle <<'LEGITEOF'
          buildscript {
              repositories {
                  jcenter()
                  mavenCentral()
                  maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
                  maven { name = "forge-old"; url = "https://files.minecraftforge.net/maven" }
              }
              dependencies {
                  classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
              }
          }

          apply plugin: 'net.minecraftforge.gradle.forge'

          version = "1.0.0"
          group = "com.legitclient"
          archivesBaseName = "LegitClient"

          sourceCompatibility = targetCompatibility = '1.8'
          compileJava.options.encoding = 'UTF-8'

          minecraft {
              version = "1.8.9-11.15.1.2318-1.8.9"
              runDir = "run"
              mappings = "stable_22"
          }

          processResources {
              inputs.property "version", project.version
              inputs.property "mcversion", project.minecraft.version

              from(sourceSets.main.resources.srcDirs) {
                  include 'mcmod.info'
                  expand 'version': project.version, 'mcversion': project.minecraft.version
              }
              from(sourceSets.main.resources.srcDirs) {
                  exclude 'mcmod.info'
              }
          }
          LEGITEOF
          cat > proj/src/main/resources/mcmod.info <<'LEGITEOF'
          [
            {
              "modid": "legitclient",
              "name": "Legit Client",
              "description": "Client legit: HUD, keystrokes, zoom, toggle sprint e FPS boost. Sem hacks.",
              "version": "${version}",
              "mcversion": "${mcversion}",
              "authorList": [],
              "credits": ""
            }
          ]
          LEGITEOF
          cat > proj/src/main/java/com/legitclient/ModConfig.java <<'LEGITEOF'
          package com.legitclient;

          import net.minecraftforge.common.config.Configuration;

          import java.io.File;
          import java.util.HashMap;
          import java.util.Map;

          public class ModConfig {
